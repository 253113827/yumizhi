<!-- PWA -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#667eea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="yumizhi">

<!-- 结构化数据 - JSON-LD -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "yumizhi (玉米知)",
  "url": "https://yumizhi.com",
  "description": "OpenClaw 技能集合网站，收录 1600+ AI 技能",
  "potentialAction": {
    "@type": "SearchAction",
    "target": "https://yumizhi.com/skills.html?q={search_term_string}",
    "query-input": "required name=search_term_string"
  }
}
</script>

<!-- 预连接和 DNS 预解析 -->
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">

<link rel="canonical" href="https://yumizhi.com/">
